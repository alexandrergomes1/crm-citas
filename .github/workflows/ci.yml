name: Checagens do app

on:
  pull_request:
    # PR só de texto (docs, .md, instruções do Claude) não gasta minutos aqui: nada a testar.
    paths-ignore: ['docs/**', '**/*.md', '.claude/**']
  # Sem `previas` no envio: o PR já testou exatamente isso (nada de rodar duas vezes). O `main` segue até a §9.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Tipos, lint, unidade e build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Versão do pnpm vem do packageManager do package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tipos
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unidade (Vitest)
        run: pnpm test
      - name: Build do Worker
        run: pnpm build
      - name: Conferência do deploy (sem publicar)
        run: pnpm exec wrangler deploy --dry-run --outdir /tmp/worker-dry-run
      - name: Zero next/* no projeto
        run: |
          if grep -rnE "from ['\"]next(/|['\"])" src e2e; then echo "::error::import de next/* encontrado"; exit 1; fi

  banco:
    name: Banco (migrations do zero + testes)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Postgres puro com o stub do Supabase (supabase/tests/00_supabase_stub.sql): sem Docker do Supabase,
    # sem projeto real. Mesma versão principal do banco de produção (17).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Replay das migrations e testes em supabase/tests
        run: bash scripts/db/replay-migrations.sh
