# desligado até a virada do banco (ver docs/STATUS.md)
name: Migrations no banco de desenvolvimento

# Sem IA. Quando uma migration nova entra na branch `previas` (ou no main), aplica no banco de DESENVOLVIMENTO (testes e prévias).
# Nunca toca na produção: o script aborta se a URL não for a do projeto de desenvolvimento.
# Manual: "Run workflow" com dry_run ligado (padrão) só lista o que aplicaria.
# Segredo: DEV_DB_URL, e se não existir, SUPABASE_DB_URL (hoje aponta para o banco de desenvolvimento).

# Gatilho automático (push em previas/main com supabase/migrations/**) retirado: só manual por enquanto.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Só listar o que seria aplicado (não grava nada)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: migrations-dev
  cancel-in-progress: false

jobs:
  aplicar:
    name: Aplicar migrations pendentes (desenvolvimento)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DB_URL: ${{ secrets.DEV_DB_URL || secrets.SUPABASE_DB_URL }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar (o script confere o banco antes de qualquer coisa)
        run: bash scripts/db/apply-dev.sh
