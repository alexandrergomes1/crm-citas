name: Segurança (segredos)

on:
  pull_request:
    # ready_for_review: a procura de segredos também roda quando o PR sai de rascunho.
    types: [opened, synchronize, reopened, ready_for_review]
  # Sem `previas` no envio: o PR já procurou segredos no mesmo conteúdo.
  push:
    branches: [main]

permissions:
  contents: read
  # A ação lista os commits do PR; sem esta leitura ela falha com 403.
  pull-requests: read

jobs:
  gitleaks:
    name: Procura de segredos
    # No PR só com ele pronto (fora de rascunho); no main sempre.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
