# desligado até a virada do banco (ver docs/STATUS.md)
name: Teste mensal de restauração

# Pega o backup mais recente do R2, descriptografa e restaura num Supabase local descartável.
# Passa só se as tabelas principais voltarem com dados. Falha = e-mail automático do GitHub.

# Agendamento DESLIGADO até a virada (F4): depende do backup diário, que também está desligado.
# Para religar na produção: restaurar o cron '41 5 2 * *' (ver docs/runbooks/go-live.md, passo 5).
# Continua disponível manualmente (Actions › Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restaurar:
    name: Restaurar o último backup
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - name: Conferir segredos
        id: check
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ] || [ -z "$R2_BUCKET" ]; then
            echo "::warning title=Teste desligado::Faltam segredos (ver docs/runbooks/backup-restore.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'true'
        with:
          version: 3.1.0

      - name: Baixar e descriptografar o mais recente
        if: steps.check.outputs.ready == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          LATEST=$(aws s3 ls "s3://$R2_BUCKET/diario/" --endpoint-url "$R2_ENDPOINT" | sort | tail -1 | awk '{print $4}')
          [ -n "$LATEST" ] || { echo "::error::Nenhum backup encontrado no R2"; exit 1; }
          echo "Backup: $LATEST"
          aws s3 cp "s3://$R2_BUCKET/diario/$LATEST" backup.gpg --endpoint-url "$R2_ENDPOINT" --only-show-errors
          mkdir -p dump
          gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 3 -d backup.gpg 3<<<"$BACKUP_PASSPHRASE" | tar -xzf - -C dump
          rm -f backup.gpg
          echo "Criado em: $(cat dump/criado-em.txt)"
          # Backup com mais de 2 dias = o diário parou.
          AGE_H=$(( ( $(date -u +%s) - $(date -u -d "$(cat dump/criado-em.txt)" +%s) ) / 3600 ))
          [ "$AGE_H" -le 48 ] || { echo "::error::Último backup tem ${AGE_H}h"; exit 1; }

      - name: Restaurar num Supabase local descartável
        if: steps.check.outputs.ready == 'true'
        run: |
          set -euo pipefail
          # Banco descartável numa pasta vazia: sem as migrations do projeto, só o que vem do backup.
          WORK=$(mktemp -d) && cp -r dump "$WORK/" && cd "$WORK"
          supabase init >/dev/null
          for try in 1 2 3; do
            supabase start -x studio,imgproxy,inbucket,realtime,storage-api,edge-runtime,logflare,vector,supavisor,postgres-meta && break
            echo "Tentativa $try falhou (limite de download de imagens?); nova tentativa em 60 s"; supabase stop --no-backup >/dev/null 2>&1 || true; sleep 60
          done
          DB="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          # Esquemas internos do Supabase (storage, auth) só aceitam escrita do administrador do banco local.
          ADMIN="postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres"
          psql "$DB" -v ON_ERROR_STOP=0 -q -f dump/roles.sql >/dev/null 2>&1 || true
          psql "$ADMIN" -v ON_ERROR_STOP=1 -q -f dump/schema.sql
          psql "$ADMIN" -v ON_ERROR_STOP=1 -q -c 'SET session_replication_role = replica;' -f dump/data.sql
          for t in organizations clients appointments; do
            n=$(psql "$DB" -tAc "select count(*) from public.$t")
            echo "$t: $n"
            [ "$n" -gt 0 ] || { echo "::error::Tabela $t voltou vazia"; exit 1; }
          done
          echo "Restauração conferida."
